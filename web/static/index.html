<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<body>

        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.5 2.8l9 5.2-9 5.2z"/></svg></span>
        <span>Clipper</span>

      <nav class="tabs" aria-label="Pages">
        <a href="#/new" data-nav="new">New Clips</a>
        <a href="#/library" data-nav="library">Library</a>

      <a class="nav-run" id="activeRun" hidden></a>

    <div class="sheet"><video controls playsinline></video></div>
  </dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
