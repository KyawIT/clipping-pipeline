# Clipping pipeline configuration
# Paths are relative to the project root.

jobs_dir: jobs
layouts_dir: layouts

download:
  video: sections           # sections = download only the audio first, then just the chosen clip intervals
                            #            (and single frames) from the online video; full = download the whole video
  max_height: 1440          # best source quality up to this height. More pixels = sharper webcam crops
                            # (a cam box is only ~30% of the frame). 2160 is sharper still but slower to process;
                            # with video: full, lower it to keep downloads small
  twitch_chat: true         # download Twitch chat replay with TwitchDownloaderCLI

transcribe:
  model: small           # large-v3 (best) | medium | small (faster, for CPU)
  device: auto              # auto | cuda | cpu
  compute_type: auto        # auto -> float16 on cuda, int8 on cpu
  batch_size: 16            # lower to 4-8 if you run out of GPU memory
  language: null            # null = auto-detect, or e.g. "en", "de"
  separate_vocals: false    # run Demucs first (better on loud games, slow on CPU)
  diarize_podcasts: true    # speaker labels in podcast mode (needs HF_TOKEN env var)

signals:
  chat_lag_sec: 6           # chat reacts a few seconds after the moment
  weights:
    chat_rate: 1.0
    chat_hype: 1.2          # emote / keyword bursts (KEKW, OMEGALUL, CLIP IT, ...)
    audio_energy: 0.8
    speech_rate: 0.3
  hype_keywords: [KEKW, OMEGALUL, LUL, LMAO, LOL, LMFAO, Pog, PogChamp, POGGERS, PogU,
                  W, WW, "CLIP IT", CLIP, Clipped, monkaS, monkaW, Sadge, PepeLaugh,
                  ICANT, "I CANT", HUH, WHAT, NAHH, "NO WAY", "+2", EZ, Kreygasm, "o7"]

candidates:
  count: 25                 # windows sent to Claude (more = better recall, more usage)
  min_gap_sec: 75           # minimum distance between candidate peaks
  before_sec: 60            # context before the peak
  after_sec: 30             # context after the peak

clips:
  min_sec: 15
  max_sec: 90
  target: 8                 # how many clips Claude should pick per video

render:
  width: 1080
  height: 1920
  fps: 30                   # 60 = smoother gameplay (Twitch streams are often 60 fps), ~2x render time
  crf: 16                   # final x264 quality: lower = better / bigger (14-18 is sensible for uploads)
  x264_preset: slow         # slower = more quality per MB (veryfast | medium | slow | slower)
  frame_format: png         # png = lossless frame capture; jpeg = faster, slightly softer
  panels: true              # crop + upscale webcam / gameplay with ffmpeg (Lanczos + sharpen) instead of in Chrome
  panel_sharpen: 0.5        # 0 = off, 1 = strong. Only applied to upscaled regions such as a small webcam
  ai_upscale: auto          # Real-ESRGAN for strongly enlarged regions (the webcam): auto = only with a GPU
                            # (NVIDIA / Apple), on = also on CPU (slow), off = Lanczos + sharpen only
  ai_denoise: 0.5           # 0 = keep texture / grain, 1 = strongest cleanup of blocks and noise
  caption_words_per_page: 3
  hook_seconds: 3.0         # how long the hook text overlay stays on screen
  split_cam_ratio: 0.38     # share of the vertical frame given to the webcam in "split"
